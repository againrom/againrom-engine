"editor.mod.missions.help" = "Миссии мода: что это за миссия, где она стоит в кампании, кто ее играет и с чем начинает. Карта, имя файла которой — номер миссии кампании, уже заменяет эту миссию; кнопка «Настроить эту замену» открывает ее настройки здесь."
"editor.mod.overview.help" = "Что лежит в моде и что о нем говорит игра. Каждый заголовок раскрывает свой список: файлы мода, файлы игры, которые он заменяет, предупреждения, на которые стоит посмотреть, и ошибки, из-за которых игра не загрузит мод."
"editor.graph.help" = "Кампания так, как ее сыграет игра с этим модом: все миссии и то, что идет после каждой. Щелчок по миссии открывает ее карту."
"editor.terrain.help" = "Все земли, которыми рисует кисть карты, по одной картинке: сначала земли игры, за ними земли этого мода. Задержите указатель на земле, чтобы увидеть все ее виды. Щелкните землю этого мода, чтобы переименовать ее, выбрать, как по ней ходят отряды, или удалить ее. Новая земля делается из одной картинки."
"editor.texts.help" = "Здесь все тексты, которые игрок читает в этом моде: названия миссий, брифинги и названия предметов. Каждый текст стоит под местом, где он показан, на английском и на русском. Впишите каждый текст на английском и на русском. Текст без русского в русской игре покажет английский. Чтобы сделать текст, выберите в «Новый текст для», где он покажется; имя ему редактор даст сам."
"editor.items.help" = "Броня и оружие, которые добавляет этот мод, и его изменения предметов самой игры. Новый предмет начинается с похожего предмета игры, выбранного по названию и картинке; название вводится на каждом языке, ключ текста редактор ведет сам. Знак (?) у строки говорит, что она задает."
"editor.files.help" = "Файлы игры, которые мод заменяет своими: картинки, звуки и другие файлы, которые читает игра. Найдите файл игры и замените его своим."
